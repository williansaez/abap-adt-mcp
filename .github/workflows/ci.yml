name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Type-check tests
        run: npx tsc --noEmit -p tsconfig.test.json
      - run: npm test -- --coverage=false
      - name: Tool catalog docs are up to date
        run: |
          node scripts/gen-tools-docs.js
          git diff --exit-code -- docs/TOOLS.md docs/tools.snapshot.json || {
            echo "docs/TOOLS.md or docs/tools.snapshot.json is stale: run 'npm run tools:docs' and commit." >&2
            exit 1
          }
      - name: Version files agree
        run: |
          node -e "const p=require('./package.json').version,s=require('./server.json');if(s.version!==p||s.packages[0].version!==p){console.error('server.json version differs from package.json');process.exit(1)}"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        run: docker build -t abap-adt-mcp:ci .
      - name: Image starts and lists tools
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
          | docker run --rm -i -e SAP_SYSTEMS='{"X":{"url":"https://example.invalid","authType":"basic","user":"u","password":"p"}}' abap-adt-mcp:ci \
          | grep -q '"name":"listSystems"'
